<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-label="30秒留饭短片的两段生成与衔接示意图"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker></defs><rect width="1200" height="820" fill="#f8fafc"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><text x="48" y="60" font-size="32" fill="#0f172a" font-weight="700">先看怎么拍，再决定是否生成</text><text x="48" y="96" font-size="19" fill="#334155" font-weight="400">示例：留饭 · 30秒 · 16:9 · 2.0默认分段 · 脚本第1版</text><text x="48" y="132" font-size="17" fill="#64748b" font-weight="400">分镜示意，非实际生成画面；不包含真实报价或已生成视频帧。</text><text x="48" y="183" font-size="22" fill="#1d4ed8" font-weight="700">01  首段生成 · 0–15秒</text><text x="632" y="183" font-size="22" fill="#1d4ed8" font-weight="700">02  承接续拍 · 15–30秒</text><g transform="translate(48 205)"><rect width="520" height="292.5" rx="12" fill="#fff8eb" stroke="#e2e8f0"/><rect x="370" y="24" width="110" height="82" rx="5" fill="#283b58"/><path d="M425 24V106M370 65H480" stroke="#64748b" stroke-width="3"/><circle cx="110" cy="100" r="21" fill="#ffe2c4" stroke="#475569" stroke-width="2"/><path d="M78 205V154Q110 120 142 154V205" fill="#94a3b8"/><path d="M110 167L168 191" fill="none" stroke="#475569" stroke-width="9" stroke-linecap="round"/><text x="88" y="66" font-size="16" fill="#334155" font-weight="400">父亲</text><circle cx="390" cy="100" r="21" fill="#ffe2c4" stroke="#475569" stroke-width="2"/><path d="M358 205V154Q390 120 422 154V205" fill="#4976ac"/><path d="M390 167L285 191" fill="none" stroke="#475569" stroke-width="9" stroke-linecap="round"/><text x="368" y="66" font-size="16" fill="#334155" font-weight="400">女儿</text><path d="M45 229H475M70 229V280M450 229V280" stroke="#94714e" stroke-width="9" stroke-linecap="round"/><rect x="200" y="205" width="95" height="22" rx="7" fill="#eebc72" stroke="#94714e" stroke-width="2"/><path d="M218 197q-8-10 0-20m20 20q-8-10 0-20" stroke="#c09b72" fill="none" stroke-width="3"/><path d="M161 244H226" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="174" y="270" font-size="16" fill="#2563eb" font-weight="400">饭盒已打开</text></g><g transform="translate(632 205)"><rect width="520" height="292.5" rx="12" fill="#fff8eb" stroke="#e2e8f0"/><rect x="370" y="24" width="110" height="82" rx="5" fill="#283b58"/><path d="M425 24V106M370 65H480" stroke="#64748b" stroke-width="3"/><circle cx="110" cy="100" r="21" fill="#ffe2c4" stroke="#475569" stroke-width="2"/><path d="M78 205V154Q110 120 142 154V205" fill="#94a3b8"/><path d="M110 167L178 191" fill="none" stroke="#475569" stroke-width="9" stroke-linecap="round"/><text x="88" y="66" font-size="16" fill="#334155" font-weight="400">父亲</text><circle cx="390" cy="100" r="21" fill="#ffe2c4" stroke="#475569" stroke-width="2"/><path d="M358 205V154Q390 120 422 154V205" fill="#4976ac"/><path d="M390 167L244 191" fill="none" stroke="#475569" stroke-width="9" stroke-linecap="round"/><text x="368" y="66" font-size="16" fill="#334155" font-weight="400">女儿</text><path d="M45 229H475M70 229V280M450 229V280" stroke="#94714e" stroke-width="9" stroke-linecap="round"/><rect x="200" y="205" width="95" height="22" rx="7" fill="#eebc72" stroke="#94714e" stroke-width="2"/><path d="M218 197q-8-10 0-20m20 20q-8-10 0-20" stroke="#c09b72" fill="none" stroke-width="3"/><ellipse cx="174" cy="219" rx="24" ry="9" fill="#fff" stroke="#64748b" stroke-width="2"/><path d="M270 179L207 205" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="192" y="160" font-size="16" fill="#2563eb" font-weight="400">分饭 →</text></g><text x="48" y="535" font-size="20" fill="#0f172a" font-weight="600">女儿回来，父亲推来热饭。</text><text x="48" y="568" font-size="17" fill="#334155" font-weight="400">结束：女儿已坐下、饭盒已打开，父亲收手。</text><text x="632" y="535" font-size="20" fill="#0f172a" font-weight="600">女儿发现空碗，把饭分给父亲。</text><text x="632" y="568" font-size="17" fill="#334155" font-weight="400">开始：接着打开的饭盒，不重复进门或推饭。</text><rect x="48" y="607" width="1104" height="86" rx="14" fill="#e8efff"/><text x="72" y="640" font-size="20" fill="#1e40af" font-weight="600">衔接点：保持人物位置、服装、灯光和已打开的饭盒。</text><text x="72" y="671" font-size="18" fill="#1e40af" font-weight="400">第2段只演新增动作；先看第1段真实视频，确认后才提交续拍。</text><text x="48" y="743" font-size="21" fill="#0f172a" font-weight="600">脚本 + 分段方案 + 示意图 → 审核窗口 → 单独确认费用与制作</text><text x="48" y="783" font-size="17" fill="#64748b" font-weight="400">改稿同步更新图表并重新审核；示意图不能替代生成后的逐段预览。</text></g></svg>
