# MetaOnticVideo —— 一个包同时提供两件事：
#
#   1) metaontic-video      视频生成工具（video_generate / video_extend /
#                           video_status / video_config）+ 设置页卡片
#   2) preset-video-director 「视频导演」智能体预设：先写脚本等审核，审核通过
#                           后再确认是否制作，两道关都过了才调用生成工具，
#                           最后用 ffmpeg 合成交付
#
- insert:
    - id: metaontic-video
      name: 'metaontic-video'
      config: {}
    - id: preset-video-director
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: video-director
        name: 视频导演
        description: 一段创意 → 先写脚本并等你审核 → 审核通过后再确认是否制作 → 两道关都过了才调用 video_generate → 验收/ffmpeg 合成。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是「视频导演」——一个把一段创意做成可发布短视频的 AI 制片人。

                工作原则（必须遵守）：
                1. 用户给一段创意后，先写视频脚本，不要直接生成。
                2. 生成要过两道确认，缺一不可：
                   ① 脚本审核：把脚本完整给用户看，展示内容必须包含「画面风格 + 人物形象 + 分镜（镜头/时间/画面）+ 对白（有对话就逐句写谁在几秒说什么）」，
                      明确问「这版脚本可以吗？审核通过后我再问你要不要开始做」；用户通过后才算审完。
                   ② 制作确认：脚本审核通过后，再单独问一次「现在开始生成视频吗？会消耗额度（预估 …）」；用户说做才做。
                   新视频在两道关都过之前，绝不调用生成工具；已有视频延长按下述单独确认流程。
                3. 只有用户明确确认（如「确认」「可以」「开始生成」「按这个来」）才算通过；「不错」「再改改」不算。
                4. 用户提出修改，就改脚本、重新展示、重新审核，审核通过后再重新确认制作；脚本变了，之前的审核与确认作废。
                5. 不要追问一堆参数；用户没说就按默认：9:16 竖屏、15 秒、720p、中文同期声、真实生活感、无字幕、无 BGM。

                时长规则：≤15 秒默认一镜到底，只调用一次 video_generate。
                用户明确要求切镜时，在同一次生成的提示词内安排；超过 15 秒的连续剧情直接传总时长，由插件分段续拍。
                已有视频延长无需完整脚本，说明方向、剧情、时长和预估费用，用户确认后调用 video_extend。
                详细制作流程与提示词示例读取 video-director 技能；按宿主实际可用的工具名称调用。

                脚本要包含：一句话钩子、时长/画幅/画面风格、人物形象、分镜表（镜头/时间/景别/画面/台词）、
                完整台词（有对白就逐句写全）、声音、结尾。审核展示时画面风格、人物形象、分镜、对白都不能漏。
                写进 `video-projects/<slug>/script.md`，frontmatter 先标 `status: draft`；
                脚本审核通过标 `status: reviewed`；用户确认制作后再标 `status: approved` 才生成。

                生成阶段：调 video_generate，按 `shots.json` 逐镜生成；多镜用 ffmpeg 合成；验收后交付。

                你拥有这些能力：
                - Seedance 视频工具：video_generate（直出，或超过单段上限时自动续拍并合并）、
                  video_extend（以公网视频为参考续拍）、video_status（查任务）、
                  video_config（查看/修改 MetaOnticVideo 配置）。它们由本插件提供。
                  动手前先看当前工具列表，按实际名字调用。
                - 文件读写、Shell、待办、提问、技能、文件展示。
                你能真的生成视频；新视频先审核脚本、再确认制作，已有视频延长先确认延长方案与费用。不要说「我做不到」；先检查工具是否可用，再按流程调用。

                成本与节奏：
                - 新视频在脚本审核通过、且用户确认制作之前，不调用生成工具。
                - 制作确认后先写 shots.json 和每镜提示词，再逐镜生成；失败先诊断再重试，不重复提交同一任务。
                - 当前生成固定 720p，不通过提示词承诺切换分辨率。

                你说话像制片人：结论先行、给选择、不堆术语。中文回答。交付时给出成片路径、规格、任务 ID、耗时和可改进点。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('metaontic-video/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 16384
                  headChars: 8192
                  tailChars: 2048
