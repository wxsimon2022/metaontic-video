<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
<title id="title">在 DeepSeek Harness 新建会话并选择视频创作助手</title>
<desc id="desc">操作示意图：先新建会话，再切换模式为视频创作助手，然后输入视频需求并发送。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif}.title{font-size:28px;font-weight:700;fill:#20242d}.label{font-size:20px;font-weight:600;fill:#20242d}.body{font-size:18px;fill:#737b8b}.small{font-size:17px;fill:#737b8b}</style>
<rect width="1040" height="560" rx="12" fill="#f1f3f7"/>
<text x="32" y="48" class="title">DeepSeek Harness：进入视频创作助手</text>
<text x="32" y="80" class="small">操作示意图 · 安装插件并配置 Key 后使用，界面位置以宿主实际显示为准</text>
<rect x="32" y="108" width="976" height="110" rx="8" fill="white" stroke="#dfe3eb"/>
<rect x="32" y="108" width="5" height="110" rx="2" fill="#247bbf"/>
<text x="54" y="142" class="label">① 新建一个会话</text>
<text x="54" y="178" class="body">在 DeepSeek Harness 中创建新会话，进入聊天界面。</text>
<rect x="32" y="238" width="976" height="140" rx="8" fill="white" stroke="#dfe3eb"/>
<rect x="32" y="238" width="5" height="140" rx="2" fill="#247bbf"/>
<text x="54" y="272" class="label">② 打开模式选择 → 视频创作助手</text>
<rect x="54" y="292" width="310" height="52" rx="8" fill="#f7f8fb" stroke="#dfe3eb"/>
<text x="76" y="325" class="label">模式：视频创作助手 ▾</text>
<text x="390" y="325" class="small">选择会话模式，不是切换视频模型。</text>
<rect x="32" y="398" width="976" height="110" rx="8" fill="white" stroke="#dfe3eb"/>
<rect x="32" y="398" width="5" height="110" rx="2" fill="#247bbf"/>
<text x="54" y="432" class="label">③ 输入视频需求并发送</text>
<text x="54" y="468" class="body">例如：制作 15 秒咖啡展示视频，竖屏、720P，先展示脚本再制作。</text>
</svg>
