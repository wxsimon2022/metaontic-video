name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      existing_version:
        description: "Mirror an existing Gitee stable version using its exact artifacts"
        required: false
        type: string
      existing_sha256:
        description: "SHA256 of the original tgz, required when mirroring"
        required: false
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SYNC_VERSION: ${{ inputs.existing_version }}
      SYNC_SHA256: ${{ inputs.existing_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release tag and pick the artifact source
        id: source
        run: |
          node scripts/validate-release.mjs
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$SYNC_VERSION" ]; then
            test "$SYNC_VERSION" = "$VERSION" || { echo 'Mirroring needs the checked out version to match.'; exit 1; }
            echo "mirror=1" >> "$GITHUB_OUTPUT"; echo "version=$VERSION" >> "$GITHUB_OUTPUT"; echo "sha=$SYNC_SHA256" >> "$GITHUB_OUTPUT"; exit 0
          fi
          test "$GITHUB_REF_NAME" = "v$VERSION" || { echo 'Run this workflow on the matching version tag.'; exit 1; }
          # Gitee 流水线先发 Release：Gitee 上已经有这一版时，GitHub 直接镜像同一份成品，两边不会各打一份包。
          if curl -fsSL --max-time 30 -o /tmp/gitee-release.json "https://gitee.com/api/v5/repos/hackloop/metaontic-video/releases/tags/v$VERSION" \
            && node -e 'const r=JSON.parse(require("node:fs").readFileSync("/tmp/gitee-release.json","utf8")); if(!r||!r.tag_name) process.exit(1)'; then
            echo "Gitee 已有 v$VERSION 正式版：按原成品镜像到 GitHub"
            echo "mirror=1" >> "$GITHUB_OUTPUT"; echo "version=$VERSION" >> "$GITHUB_OUTPUT"; echo "sha=-" >> "$GITHUB_OUTPUT"
          else
            echo "Gitee 还没有 v$VERSION 的成品：本次由 GitHub 自己构建打包"
            echo "mirror=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Install build tooling
        if: ${{ steps.source.outputs.mirror != '1' }}
        run: npm ci
      - name: Build and test
        if: ${{ steps.source.outputs.mirror != '1' }}
        run: npm run build && node --test tests/*.test.mjs
      - name: Pack plugin
        if: ${{ steps.source.outputs.mirror != '1' }}
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          VERSION=$(node -p "require('./package.json').version")
          python3 scripts/strip-package-readme.py "dist/metaontic-video-$VERSION.tgz"
      - name: Reuse the published Gitee artifact
        if: ${{ steps.source.outputs.mirror == '1' }}
        run: python3 scripts/download-published-release.py "${{ steps.source.outputs.version }}" dist "${{ steps.source.outputs.sha }}"
      - name: Prepare public release notes
        run: |
          node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs"; import {publicReleaseNotes} from "./scripts/release.mjs"; const p=JSON.parse(readFileSync("package.json","utf8")); writeFileSync("dist/release-notes.txt", publicReleaseNotes(p.version,p.releaseNotes.items));'
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/

  platform-install:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - name: Install fixed pnpm tooling
        run: npm install --global pnpm@11.28.5
      - name: Validate managed package installation
        shell: bash
        run: node scripts/check-package-install.mjs dist/*.tgz

  release:
    needs: [prepare, platform-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - name: Upload release package
        env:
          RELEASE_TAG: ${{ inputs.existing_version && format('v{0}', inputs.existing_version) || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_FLAGS=()
          if [ "$(node -p "Boolean(require('./package.json').releaseNotes.prerelease)")" = "true" ]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file dist/release-notes.txt
            gh release upload "$RELEASE_TAG" dist/*.tgz --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.tgz --verify-tag --title "MetaOnticVideo $RELEASE_TAG" --notes-file dist/release-notes.txt "${RELEASE_FLAGS[@]}"
          fi
