name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$VERSION" || { echo 'Run this workflow on the matching version tag.'; exit 1; }
      - name: Install build tooling
        run: npm ci
      - name: Build and test
        run: npm run build && node --test tests/*.test.mjs
      - name: Pack plugin
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > dist/release-notes.txt
      - name: Upload release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_FLAGS=()
          if [ "$(node -p "Boolean(require('./package.json').releaseNotes.prerelease)")" = "true" ]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tgz --verify-tag --title "MetaOnticVideo $GITHUB_REF_NAME" --notes-file dist/release-notes.txt "${RELEASE_FLAGS[@]}"
          fi
      - name: Upload Gitee release package
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          export GITEE_PRERELEASE=$(node -p "Boolean(require('./package.json').releaseNotes.prerelease)")
          node scripts/publish-gitee.mjs "$GITHUB_REF_NAME" dist/*.tgz dist/release-notes.txt
