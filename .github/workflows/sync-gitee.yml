name: sync-gitee

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to mirror to Gitee
        required: true
        default: v3.3.0

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download published archives and tag notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --pattern "metaontic-video-${RELEASE_TAG#v}.tgz" \
            --pattern "MetaOnticVideo-Windows-${RELEASE_TAG#v}.zip" \
            --pattern "MetaOnticVideo-Windows-${RELEASE_TAG#v}.zip.sha256" \
            --dir dist
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" > dist/release-notes.txt
      - name: Publish and verify every Gitee archive
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          for ARCHIVE in dist/*.tgz dist/*.zip dist/*.zip.sha256; do
            node scripts/publish-gitee.mjs "$RELEASE_TAG" "$ARCHIVE" dist/release-notes.txt
          done
      # 一次性维护步骤：企业附件配额已满，先清掉过期的旧发行版再上传。合并回 master 前删除本步骤。
      - name: Prune expired Gitee releases (maintenance)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          KEEP: '3'
          DAYS: '3'
          DRY_RUN: 'true'
        run: node scripts/prune-gitee.mjs
