name: sync-gitee

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to mirror to Gitee
        required: true
        default: v3.3.0

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download published archive and tag notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          mkdir -p dist
          gh release download "$RELEASE_TAG" --pattern "metaontic-video-${RELEASE_TAG#v}.tgz" --dir dist
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" > dist/release-notes.txt
      - name: Publish and verify Gitee archive
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/publish-gitee.mjs "$RELEASE_TAG" "dist/metaontic-video-${RELEASE_TAG#v}.tgz" dist/release-notes.txt
